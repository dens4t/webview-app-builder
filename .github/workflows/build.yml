name: Build WebView App

on:
  repository_dispatch:
    types: [ build_webview ]

permissions:
  contents: write

run-name: build-${{ github.event.client_payload.job_id }}

concurrency:
  group: webview-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Pillow
        run: python3 -m pip install --quiet --disable-pip-version-check pillow

      - name: Configure app
        env:
          APP_URL: ${{ github.event.client_payload.url }}
          APP_NAME: ${{ github.event.client_payload.name }}
          APP_ID: ${{ github.event.client_payload.job_id }}
          SHOW_ADS: ${{ github.event.client_payload.ads }}
          APP_AD_URL: ${{ github.event.client_payload.ad_url }}
          STARTIO_APP_ID: ${{ github.event.client_payload.startio_app_id }}
          STARTIO_TEST_ADS: ${{ github.event.client_payload.startio_test_ads }}
        run: python3 scripts/configure.py

      - name: Generate app icon
        env:
          APP_NAME: ${{ github.event.client_payload.name }}
          ICON_URL: ${{ github.event.client_payload.icon_url }}
        run: python3 scripts/icon.py

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Prepare artifact
        env:
          SLUG: ${{ github.event.client_payload.slug }}
        run: |
          mkdir -p out
          name="${SLUG:-app}"
          cp app/build/outputs/apk/release/app-release.apk "out/${name}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.event.client_payload.job_id }}
          name: Build ${{ github.event.client_payload.job_id }}
          body: |
            URL: ${{ github.event.client_payload.url }}
            Name: ${{ github.event.client_payload.name }}
          files: out/*.apk
