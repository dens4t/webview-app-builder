org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Start.io (StartApp) App ID for banner ads in generated apps.
# "0" (default) disables Start.io ads entirely. The CI configure step
# (scripts/configure.py) can override this per build via the
# repository_dispatch payload field "startio_app_id".
STARTIO_APP_ID=0
